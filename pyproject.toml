[project]
name = "aitraderpro"
version = "0.1.0"
description = "Algorithmic trading platform: FastAPI backend, Zerodha Kite integration, TradingView MCP, scanner engine."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["backend", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "ASYNC"]
ignore = [
    "B008",   # FastAPI's Depends() in argument defaults is idiomatic
    "UP042",  # str+Enum is kept deliberately: SQLAlchemy Enum + pydantic both rely on it
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "N999"]
"tests/*" = ["E501", "N802", "N818"]
"backend/app/pine/generator.py" = ["E501"]  # long lines are Pine template content, not Python

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*", "dashboard.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers -m 'not integration'"
markers = [
    "integration: requires live Postgres/Redis (deselected by default)",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
